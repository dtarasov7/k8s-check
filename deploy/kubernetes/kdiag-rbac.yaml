apiVersion: v1
kind: Namespace
metadata:
  name: kdiag-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kdiag-reader
  namespace: kdiag-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kdiag-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "services", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "csidrivers", "csinodes", "storageclasses", "csistoragecapacities"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cilium-config", "coredns"]
    verbs: ["get"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnodes", "ciliumendpoints", "ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/readyz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kdiag-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kdiag-reader
subjects:
  - kind: ServiceAccount
    name: kdiag-reader
    namespace: kdiag-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kdiag-pod-logs
  namespace: d8-kube-dns
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kdiag-pod-logs
  namespace: d8-kube-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kdiag-pod-logs
subjects:
  - kind: ServiceAccount
    name: kdiag-reader
    namespace: kdiag-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kdiag-pod-logs
  namespace: d8-cni-cilium
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kdiag-pod-logs
  namespace: d8-cni-cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kdiag-pod-logs
subjects:
  - kind: ServiceAccount
    name: kdiag-reader
    namespace: kdiag-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kdiag-pod-logs
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kdiag-pod-logs
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kdiag-pod-logs
subjects:
  - kind: ServiceAccount
    name: kdiag-reader
    namespace: kdiag-system
